<!-- ================= CONTACT / ENQUIRY ================= -->

    <section id="contact" class="contact-section">

      <div class="contact-content">

        <p class="section-label">
          LET'S TALK
        </p>

        <h2>
          Have an idea?<br>
          <span>Let's build it.</span>
        </h2>

        <p>
          Tell us what you need and we'll get back
          to you with the right digital direction.
        </p>

        <!-- ================= VELORA CONTACT OPTIONS ================= -->

        <div class="velora-contact-options">

          <!-- WHATSAPP -->
          <a
            href="https://wa.me/918088590273"
            target="_blank"
            rel="noopener noreferrer"
            class="velora-contact-button"
          >
            <strong>WhatsApp</strong>
            <span>+91 80885 90273</span>
          </a>

          <!-- PHONE -->
          <a
            href="tel:+918088590273"
            class="velora-contact-button"
          >
            <strong>Phone</strong>
            <span>+91 80885 90273</span>
          </a>

          <!-- EMAIL -->
          <a
            href="mailto:veloradigitalco.in@gmail.com"
            class="velora-contact-button"
          >
            <strong>Email</strong>
            <span>veloradigitalco.in@gmail.com</span>
          </a>

          <!-- INSTAGRAM -->
          <a
            href="https://www.instagram.com/veloradigital.co.in/"
            target="_blank"
            rel="noopener noreferrer"
            class="velora-contact-button"
          >
            <strong>Instagram</strong>
            <span>@veloradigital.co.in</span>
          </a>

          <!-- WEBSITE -->
          <a
            href="https://veloradigital.co.in/"
            target="_blank"
            rel="noopener noreferrer"
            class="velora-contact-button"
          >
            <strong>Website</strong>
            <span>veloradigital.co.in</span>
          </a>

        </div>

      </div>


      <form
        id="enquiryForm"
        class="enquiry-form"
      >

        <input
          type="text"
          name="name"
          placeholder="Your Name"
          required
        >

        <input
          type="tel"
          name="phone"
          placeholder="Phone / WhatsApp Number"
          required
        >

        <input
          type="email"
          name="email"
          placeholder="Email Address"
        >

        <select name="service" required>

          <option value="">
            What do you need?
          </option>

          <option>
            Website Design & Development
          </option>

          <option>
            E-Commerce
          </option>

          <option>
            Web Application
          </option>

          <option>
            Automation
          </option>

          <option>
            Digital Strategy
          </option>

          <option>
            Custom Digital Solution
          </option>

        </select>


        <select name="budget">

          <option value="">
            Approximate Budget
          </option>

          <option>
            ₹5,000+
          </option>

          <option>
            ₹12,000+
          </option>

          <option>
            ₹25,000+
          </option>

          <option>
            ₹50,000+
          </option>

          <option>
            Not Sure
          </option>

        </select>


        <textarea
          name="message"
          rows="5"
          placeholder="Tell us about your project..."
          required
        ></textarea>


        <button
          type="submit"
          class="primary-button"
        >
          Send Enquiry →
        </button>

      </form>

    </section>
